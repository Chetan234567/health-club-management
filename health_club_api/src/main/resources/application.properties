# Application Flow:
# React frontend -> secured Spring Boot REST API -> Service layer -> Hibernate/JPA -> MySQL database.

# Server Port
server.port=8081

# Application Name
spring.application.name=health-club-api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/health_club_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=JWT_SECRET_KEY
app.jwt.expiration-ms=86400000

# CORS Security Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Razorpay Payment Gateway Keys
razorpay.key.id=RAZOR_PAY_ID
razorpay.key.secret=RAZOR_PAY_SECRET
